name: Build & Package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build wadbd native binary
        run: |
          mkdir -p system/bin
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o system/bin/wadbd ./cmd/wadbd
          chmod 755 action.sh service.sh system/bin/wadbd
          rm -f system/bin/wadbd-monitor

      - name: Package Magisk/KSU Module ZIP
        run: |
          zip -r9 wadbd.zip \
            META-INF \
            action.sh \
            changelog.md \
            module.prop \
            service.sh \
            system \
            webroot \
            LICENSE

      - name: Upload Module ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wadbd-module
          path: wadbd.zip
          retention-days: 30
