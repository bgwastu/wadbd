name: Build & Package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android App APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Module Structure
        run: |
          mkdir -p system/priv-app/Wadbd
          cp app/build/outputs/apk/release/app-release.apk system/priv-app/Wadbd/Wadbd.apk

      - name: Package Magisk/KSU Module ZIP
        run: |
          zip -r9 wadbd.zip \
            META-INF \
            action.sh \
            changelog.md \
            module.prop \
            service.sh \
            system \
            webroot \
            LICENSE

      - name: Upload Module ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wadbd-module
          path: wadbd.zip
          retention-days: 30
