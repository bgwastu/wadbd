name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Version
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android App APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Module Structure
        run: |
          mkdir -p system/priv-app/Wadbd
          cp app/build/outputs/apk/release/app-release.apk system/priv-app/Wadbd/Wadbd.apk
          cp app/build/outputs/apk/release/app-release.apk wadbd.apk

      - name: Package Magisk/KSU Module ZIP
        run: |
          zip -r9 "wadbd-v${{ env.VERSION }}.zip" \
            META-INF \
            action.sh \
            changelog.md \
            module.prop \
            service.sh \
            system \
            webroot \
            LICENSE
          cp "wadbd-v${{ env.VERSION }}.zip" wadbd.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wadbd-v${{ env.VERSION }}.zip
            wadbd.zip
            wadbd.apk
          generate_release_notes: true
